name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests-and-focused-builds:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Core tests
        run: dotnet restore TraderVI.Core.Tests/TraderVI.Core.Tests.csproj

      - name: Run Core tests
        run: dotnet test TraderVI.Core.Tests/TraderVI.Core.Tests.csproj --no-restore --configuration Release --verbosity minimal

      - name: Restore focused applications
        shell: pwsh
        run: |
          dotnet restore Delphi/Delphi.csproj
          dotnet restore Hermes/Hermes.csproj
          dotnet restore Athena/Athena.csproj
          dotnet restore TraderVI/TraderVI.csproj
          dotnet restore TraderVI.WPF/TraderVI.WPF.csproj

      - name: Build focused applications
        shell: pwsh
        run: |
          dotnet build Delphi/Delphi.csproj --no-restore --configuration Release --verbosity minimal
          dotnet build Hermes/Hermes.csproj --no-restore --configuration Release --verbosity minimal
          dotnet build Athena/Athena.csproj --no-restore --configuration Release --verbosity minimal
          dotnet build TraderVI/TraderVI.csproj --no-restore --configuration Release --verbosity minimal
          dotnet build TraderVI.WPF/TraderVI.WPF.csproj --no-restore --configuration Release --verbosity minimal

  database-project-build:
    name: Database project build (no deploy)
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Visual Studio and SSDT
        shell: pwsh
        run: |
          $visualStudioRoot = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          $msbuild = Join-Path $visualStudioRoot 'MSBuild\Current\Bin\MSBuild.exe'
          $ssdtTargets = Join-Path $visualStudioRoot 'MSBuild\Microsoft\VisualStudio\v18.0\SSDT\Microsoft.Data.Tools.Schema.SqlTasks.targets'

          if (-not (Test-Path -LiteralPath $msbuild -PathType Leaf)) {
            throw "Visual Studio MSBuild was not found at $msbuild. Review the pinned runner image."
          }
          if (-not (Test-Path -LiteralPath $ssdtTargets -PathType Leaf)) {
            throw "SSDT targets were not found at $ssdtTargets. Review the pinned runner image."
          }

          "TRADERVI_MSBUILD=$msbuild" >> $env:GITHUB_ENV

      - name: Build TraderDB project without deployment
        shell: pwsh
        run: |
          & $env:TRADERVI_MSBUILD TraderDB/TraderDB.sqlproj `
            /target:Build `
            /property:Configuration=Release `
            /property:Platform=AnyCPU `
            /property:DeployOnBuild=False `
            /maxCpuCount `
            /nologo `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

# The SSDT job compiles the schema only. It has no database credentials, runs no
# migration or publish target, and deliberately does not upload the DACPAC.
